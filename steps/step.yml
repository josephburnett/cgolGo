# `step` runs a simulation of Conway's Game of Life (CGOL). The
# optional step inputs `width` and `height` determine the dimensions
# of the simulation. The optional step input `length` determines the
# number of generations in the simulation. The step output
# `frame_files` is a list of filenames, each containing a single
# generation represented as a JSON array (frame). The frame is a list
# of lists containing either 1 or 0 for each cell representing alive
# of dead.
spec:
  inputs:
    width:
      # Width in cells of the simulation.
      type: number
      default: 100
    height:
      # Height in cells of the simulation.
      type: number
      default: 100
    length:
      # Number of generations of the simulation.
      type: number
      default: 100
  outputs:
    frame_files:
      # List of filenames created, one per generation.
      type: array
---

run:
  - name: simulation
    step: ./internal/simulation.yml
    inputs:
      width: ${{ inputs.width }}
      height: ${{ inputs.height }}
      length: ${{ inputs.length }}
      filename: simulation.json
  - name: frames
    step: ./internal/frames
    inputs:
      filename: simulation.json
outputs:
  frame_files: ${{ steps.frames.outputs.frame_files }}
