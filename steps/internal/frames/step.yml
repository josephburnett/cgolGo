# The internal `frames` step breaks the single output JSON file from
# the `simulation` step into individual frames.
spec:
  inputs:
    filename:
      type: string
  outputs:
    frame_files:
      type: array
---

exec:
  command:
    - ${{ step_dir }}/../../../bin/frames
    - --name
    - frame_files
    - --value-file
    - ${{ inputs.filename }}
    - --output-file
    - ${{ output_file }}
